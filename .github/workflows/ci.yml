name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run --extra comments-reader ruff check .

      - name: Type check (ty)
        run: uv run --extra comments-reader ty check

  test:
    runs-on: ubuntu-latest
    # Run 38487097199 exceeded an earlier bound with two file partitions.
    # Partitions hash by file, so they are uneven: on five recent full runs partition 3 took 15-26 minutes and
    # partition 2 took 8-16. Partition 3 hit 25 minutes on runs 41151838063 and 41238221217, the second at 97%.
    # Main and shared changes run the full suite. Independent test-only PRs
    # retain complete collection manifests and execute only the changed files.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --extra comments-reader python -B scripts/run_ci_tests.py ${{ matrix.partition }} --manifest "$RUNNER_TEMP/ci-partition-${{ matrix.partition }}.json" -ra

      - name: Retain complete test selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-partition-${{ matrix.partition }}
          path: ${{ runner.temp }}/ci-partition-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 14

  data-dictionary:
    # Guards that the data dictionary stays in sync with the schema: the
    # descriptions cover every column, and the committed table pages match what
    # the generator would produce. A schema change without a docs update fails
    # here. Offline (no network) — the live-data reconciliation runs in the
    # docs deploy workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Check descriptions vs schema
        run: uv run spicy-regs-dict check

      - name: Verify generated table pages are up to date
        run: |
          uv run spicy-regs-dict generate
          git diff --exit-code docs/tables \
            || { echo "::error::docs/tables is stale. Run 'uv run spicy-regs-dict generate' and commit."; exit 1; }

  changed-joins:
    # New/changed declarations get full public key-column reads immediately.
    # Nothing scheduled checks unchanged joins: run scripts/check_table_joins.py
    # by hand for the whole registry (ss-i1dy).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install checker dependencies
        run: uv sync --frozen --no-default-groups
      - name: Check changed declarations against published data
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=(--receipt join-check-results.json)
          if [ -n "$CHANGE_BASE" ] && [ "$CHANGE_BASE" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--changed-since "$CHANGE_BASE")
          fi
          uv run --frozen --no-default-groups python scripts/check_table_joins.py "${ARGS[@]}"
      - name: Retain join measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-join-measurements
          path: join-check-results.json
          if-no-files-found: warn
          retention-days: 14
