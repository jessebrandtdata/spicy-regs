name: Rollup — fr_docket_links
# Manual repair entry point; routine execution is sequenced by its parent workflow.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean

jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fr-docket-links
      producer_ref: main
      # Rebuilt whole from the pinned Register table in DuckDB, no receipts (ss-vse3 step 3).
      timeout_minutes: 30
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
