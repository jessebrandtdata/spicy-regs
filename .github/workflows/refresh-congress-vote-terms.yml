name: Refresh congressional votes and terms
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run of the whole chain on the dispatched ref)'
        required: false
        default: false
        type: boolean
concurrency:
  group: congress-vote-terms
  cancel-in-progress: false
  queue: max
jobs:
  votes:
    # Votes pin the members crosswalk; finish its writer before capturing inputs.
    needs: [members]
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-roll-call-votes
      require_bulk: true
      # No receipts since ss-vse3: on 2026-11-11 the job took 49 minutes, about 42 of them receipt work (download
      # 3, member_votes restore 8, receipt write 22, upload 8, combine 1). About 7 remain, plus about 1 for the
      # published-table reads; 30 keeps twice a busy night's estimate. The first night restores roll_call_votes
      # through its last receipts by range (7 s measured).
      timeout_minutes: 30
      free_disk: true
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
  members:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-members
      timeout_minutes: 15
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
  terms:
    needs: [votes, members]
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-member-vote-terms
      require_bulk: true
      free_disk: true
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
