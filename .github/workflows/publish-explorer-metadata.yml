name: Publish explorer metadata
on:
  workflow_dispatch:
  # One trigger for every publisher: hosted rollups, workstation publishes (which
  # fire no workflow_run) and main revisions once their push CI passes. Hourly is
  # fresh enough while nothing consumes the bundle; a run whose revision and R2
  # inputs are unchanged exits in seconds. This replaced a 15-minute cron, push
  # paths and a workflow_run list of 49 names kept by hand (896 runs in 7 days).
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: explorer-metadata
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      publish: ${{ steps.ci.outputs.publish }}
    steps:
      - name: Require successful CI for the exact main revision
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('publish', 'false');
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const sha = ref.object.sha;
            core.setOutput('sha', sha);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: sha, per_page: 100
            });
            const runs = data.workflow_runs
              .filter(run => run.head_sha === sha && run.head_branch === 'main' && run.event === 'push')
              .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            const latest = runs[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              const state = latest ? `${latest.status}/${latest.conclusion ?? 'pending'}` : 'no push CI run yet';
              core.notice(`Skipping publication for ${sha}: CI is ${state}. The next hourly run retries.`);
              return;
            }
            core.setOutput('publish', 'true');
            core.info(`Publishing revision ${sha}, verified by CI run ${latest.id}.`);
  publish:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin the trusted main revision that passed CI in preflight.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # Same verified revision and the same R2 input bytes as the live metadata: nothing to rebuild.
      # Only an exact match skips; a change, an unreadable input or a failure of this step runs everything.
      # A manual dispatch always runs the full refresh.
      - name: Exit early when no input changed
        id: quick
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: uv run --no-project --python 3.12 --with boto3==1.42.33 python scripts/explorer_metadata_unchanged.py --revision "${{ needs.preflight.outputs.sha }}"
      - uses: actions/setup-python@v5
        if: steps.quick.outputs.unchanged != 'true'
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        if: steps.quick.outputs.unchanged != 'true'
        run: uv sync --frozen --group source-readers
      - name: Validate metadata behavior
        if: steps.quick.outputs.unchanged != 'true'
        env:
          PYTHONPATH: src
        run: uv run --frozen --no-sync pytest --noconftest tests/test_explorer_inputs.py tests/test_explorer_metadata.py tests/test_explorer_publications.py tests/test_column_navigation.py tests/test_navigation_measurements.py tests/test_navigation_measurement_runner.py -q
      - name: Publish only the explorer metadata bundle
        if: steps.quick.outputs.unchanged != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run --frozen --no-sync python scripts/publish_explorer_metadata.py --publish
      - uses: actions/upload-artifact@v4
        if: steps.quick.outputs.unchanged != 'true'
        with:
          name: explorer-metadata
          path: output/explorer-metadata.v1.json
          retention-days: 7
