name: Rollup — federal_register
on:
  schedule:
    # Refresh docket links only after this publication succeeds.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Re-read start date (YYYY-MM-DD); blank resumes from the prior table, 1994-01-01 refetches every document'
        required: false
        default: ''
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-federal-register
      producer_ref: main
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      fr_since: ${{ inputs.since || '' }}
      # No receipts since ss-vse3 step 3: a night downloads the pinned table (283 MB on 2026-11-10), reads ~9,000
      # documents and merges natively, about 2 of the 45.7 minutes the receipt route took (2026-11-09 timers). 30
      # keeps a wide margin over setup and upload and stops a hang 150 minutes sooner. A re-read (`since`) maps every
      # document it fetches in Python, up to the whole million rows, so it keeps 240.
      timeout_minutes: ${{ inputs.since && 240 || 30 }}

  docket-links:
    needs: run
    if: ${{ !inputs.skip_upload }}
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-fr-docket-links
      producer_ref: main
      # Rebuilt whole from the pinned Register table in DuckDB, no receipts (ss-vse3 step 3).
      timeout_minutes: 30
