name: Rollup (reusable)

# Reusable workflow that runs one decoupled rollup pipeline (`run-rollup-*`).
# Source schedules, dependency refreshes and manual callers all delegate here
# so the build/publish steps live in one place.
#
# The `run-rollup-*` console scripts default to --skip-upload (vetting), so this
# passes --no-skip-upload for real runs; callers can flip it back for dry runs.
on:
  workflow_call:
    inputs:
      command:
        description: 'The run-rollup-* console script to run (e.g. run-rollup-feed-summary)'
        required: true
        type: string
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      sam_ingest_mode:
        description: 'SAM source mode: extract or partition'
        required: false
        default: 'extract'
        type: string
      sam_since_year:
        description: 'Optional first SAM registration year; blank uses the rotating year'
        required: false
        default: ''
        type: string
      sam_until_year:
        description: 'Optional last SAM registration year'
        required: false
        default: ''
        type: string
      sam_max_records:
        description: 'Optional explicit SAM record limit; blank or zero is unbounded'
        required: false
        default: ''
        type: string
      fec_inputs_url:
        description: 'Explicit HTTPS URL of a prepared retained-input tar archive; no source acquisition'
        required: false
        default: ''
        type: string
      fec_inputs_sha256:
        description: 'Expected SHA-256 of the exact transferred archive'
        required: false
        default: ''
        type: string
      fec_manifest_sha256:
        description: 'Expected SHA-256 of manifest.json inside the archive'
        required: false
        default: ''
        type: string
      fec_max_archive_bytes:
        description: 'Maximum transferred retained-input archive bytes'
        required: false
        default: '4000000000'
        type: string
      fec_max_extracted_bytes:
        description: 'Maximum extracted retained-input bytes; leave runner space for outputs'
        required: false
        default: '8000000000'
        type: string
      cfr_replace_all:
        description: 'cfr_sections: re-place every listed package, not only changed ones'
        required: false
        default: false
        type: boolean
      lda_since:
        description: 'Optional LDA catch-up start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      lda_until:
        description: 'Optional LDA catch-up end date (YYYY-MM-DD; still capped to a 30-day run)'
        required: false
        default: ''
        type: string
      bill_family_congresses:
        description: 'Optional comma-separated Congress numbers to scope the bill-family rollup (e.g. 118,119)'
        required: false
        default: ''
        type: string
      spicy_regs_congresses:
        description: 'Optional comma-separated Congress numbers or range (e.g. 93-119)'
        required: false
        default: ''
        type: string
      amendments_max_details:
        description: 'Optional per-run detail request cap for the amendments rollup'
        required: false
        default: ''
        type: string
      bill_family_max_version_fetches:
        description: 'Bill-family printing / pre-108 backfill acquisition cap; 0 disables those requests'
        required: false
        default: '600'
        type: string
      bill_family_bill_types:
        description: 'Optional comma-separated bill types to scope the bill-family rollup (e.g. hr,s,hres)'
        required: false
        default: ''
        type: string
      roll_call_chambers:
        description: 'Optional comma-separated chambers the roll-call rollup reads (house, senate); blank reads both'
        required: false
        default: ''
        type: string
      roll_call_max_votes:
        description: 'Optional roll-call fetch cap for one run, 1 to 4000; blank uses 1500'
        required: false
        default: ''
        type: string
      bill_subjects_max:
        description: 'Optional cap on Congress.gov bills the bill-subjects rollup asks (blank uses its default)'
        required: false
        default: ''
        type: string
      committee_reports_since:
        description: 'Optional GovInfo CRPT/CHRG last-modified start (YYYY-MM-DD); blank uses a 30-day window'
        required: false
        default: ''
        type: string
      print_citations_since:
        description: 'Optional GovInfo CRPT/BUDGET issue-date floor (YYYY-MM-DD); blank uses 2023-01-01'
        required: false
        default: ''
        type: string
      senate_expenditures_since:
        description: 'Optional GovInfo CDOC issue-date floor (YYYY-MM-DD); blank uses 2024-01-01'
        required: false
        default: ''
        type: string
      fcc_since:
        description: 'Optional FCC ECFS backfill start date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      fr_since:
        description: 'Optional Federal Register re-read start date (YYYY-MM-DD); 1994-01-01 refetches every document'
        required: false
        default: ''
        type: string
      usaspending_every_funded:
        description: 'Walk every USAspending recipient funded in the trailing 12 months instead of the top pages'
        required: false
        default: false
        type: boolean
      fec_committees_full_walk:
        description: 'Walk the whole FEC committee registry instead of the recent-filing delta'
        required: false
        default: false
        type: boolean
      gao_govinfo_history:
        description: "gao_reports: also walk GovInfo's closed GAOREPORTS listing (1989-2008 reports and testimony)"
        required: false
        default: false
        type: boolean
      gao_govinfo_mods:
        description: "gao_reports: read the next batch of GovInfo history rows' MODS (abstract, topics, type, number)"
        required: false
        default: false
        type: boolean
      gao_product_pages:
        description: "gao_reports: read pending rows' GAO product pages through Zyte (counts, page count, subject terms)"
        required: false
        default: false
        type: boolean
      gao_product_pages_undo:
        description: "gao_reports: put back what the product-page reads of a UTC day, a day and hour, or a reader rule replaced"
        required: false
        default: ''
        type: string
      gao_allow_mass_close_reason:
        description: "gao_recommendations: why this run may retire more than half the open recommendations (dispatch only)"
        required: false
        default: ''
        type: string
      lda_filing_year:
        description: 'Optional LDA filing year to read whole, instead of the posted-date window (history backfill)'
        required: false
        default: ''
        type: string
      fcc_proceedings:
        description: 'Optional comma-separated FCC proceeding names to scope the filings fetch (e.g. 17-108,23-320)'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Job timeout. Raise it for a rollup whose catch-up window is much larger than its steady state.'
        required: false
        default: 30
        type: number
      require_bulk:
        description: 'Refuse wholesale row fallback for mapped bulk datasets; unmapped datasets and sparse row decisions remain supported'
        required: false
        default: false
        type: boolean
      free_disk:
        description: 'Free ~25 GB of preinstalled toolchains first and log the lowest free disk seen (rollups that carry ~10M-row receipt tables)'
        required: false
        default: false
        type: boolean
      producer_ref:
        description: 'Optional producer checkout ref; blank preserves the caller revision'
        required: false
        default: ''
        type: string

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.producer_ref }}

      - name: Free runner disk and watch what is left
        if: inputs.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          mkdir -p output
          df -k --output=avail / | tail -1 > "$RUNNER_TEMP/disk-watch.log"
          nohup sh -c 'while sleep 20; do df -k --output=avail / | tail -1; done' >> "$RUNNER_TEMP/disk-watch.log" 2>&1 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Retain invocation scope
        env:
          ROLLUP_INPUTS: ${{ toJSON(inputs) }}
        run: |
          mkdir -p output
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          scope = json.loads(os.environ['ROLLUP_INPUTS'])
          # URLs may carry temporary access tokens; digests identify transferred bytes.
          scope.pop('fec_inputs_url', None)
          receipt = {
              'started_at': datetime.datetime.now(datetime.UTC).isoformat(),
              'code_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_revision': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'inputs': scope,
          }
          Path('output/invocation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Prepare explicit retained FEC inputs
        if: inputs.command == 'build-fec-observations'
        env:
          FEC_INPUTS_URL: ${{ inputs.fec_inputs_url }}
          FEC_INPUTS_SHA256: ${{ inputs.fec_inputs_sha256 }}
          FEC_MANIFEST_SHA256: ${{ inputs.fec_manifest_sha256 }}
          MAX_ARCHIVE_BYTES: ${{ inputs.fec_max_archive_bytes }}
          MAX_EXTRACTED_BYTES: ${{ inputs.fec_max_extracted_bytes }}
        run: |
          [[ "$FEC_INPUTS_URL" == https://* ]] || { echo 'An explicit HTTPS input archive is required'; exit 1; }
          [[ "${FEC_INPUTS_SHA256#sha256:}" =~ ^[0-9a-f]{64}$ ]] || { echo 'Archive SHA-256 is required'; exit 1; }
          [[ "${FEC_MANIFEST_SHA256#sha256:}" =~ ^[0-9a-f]{64}$ ]] || { echo 'Manifest SHA-256 is required'; exit 1; }
          [[ "$MAX_ARCHIVE_BYTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$MAX_EXTRACTED_BYTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 30 --max-time 900 --max-filesize "$MAX_ARCHIVE_BYTES" \
            --output "$RUNNER_TEMP/fec-retained-inputs.tar" "$FEC_INPUTS_URL"
          uv run --frozen python scripts/prepare_fec_retained_inputs.py \
            --archive "$RUNNER_TEMP/fec-retained-inputs.tar" \
            --archive-sha256 "$FEC_INPUTS_SHA256" --manifest-sha256 "$FEC_MANIFEST_SHA256" \
            --max-archive-bytes "$MAX_ARCHIVE_BYTES" --max-extracted-bytes "$MAX_EXTRACTED_BYTES" \
            --output-dir "$RUNNER_TEMP/fec-retained-inputs" --audit-dir output/fec-inputs
          rm "$RUNNER_TEMP/fec-retained-inputs.tar"

      - name: Run rollup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # The shared api.data.gov key is contended, so the roll-call votes rollup,
          # which reads only the keyless Clerk and Senate hosts, does not receive it.
          DATA_GOV_API_KEY: ${{ inputs.command != 'run-rollup-roll-call-votes' && secrets.DATA_GOV_API_KEY || '' }}
          # A hosted runner has tens of GB in total, so the workstation's 100 GiB
          # free-space floor would refuse any download; keep 4 GiB free instead.
          SPICY_REGS_DISK_FLOOR_GIB: '4'
          SPICY_REGS_REQUIRE_BULK: ${{ inputs.require_bulk && 'true' || 'false' }}
          # Keep FEC evidence outside a hidden directory so successful and
          # interrupted traversals can be inspected after the runner exits.
          FEC_CAPTURE_DIR: output/fec-captures
          # SAM requires source access; missing/failed access must abort publication.
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_INGEST_MODE: ${{ inputs.sam_ingest_mode }}
          SAM_SINCE_YEAR: ${{ inputs.sam_since_year }}
          SAM_UNTIL_YEAR: ${{ inputs.sam_until_year }}
          SAM_MAX_RECORDS: ${{ inputs.sam_max_records }}
          # Optional: raises the Senate LDA API rate limit. The lobbying-filings
          # rollup is fully functional keyless, so an unset secret is fine.
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          CFR_REPLACE_ALL: ${{ inputs.cfr_replace_all }}
          LDA_SINCE: ${{ inputs.lda_since }}
          LDA_UNTIL: ${{ inputs.lda_until }}
          BILL_FAMILY_CONGRESSES: ${{ inputs.bill_family_congresses || inputs.spicy_regs_congresses }}
          SPICY_REGS_CONGRESSES: ${{ inputs.spicy_regs_congresses || inputs.bill_family_congresses }}
          AMENDMENTS_MAX_DETAILS: ${{ inputs.amendments_max_details }}
          BILL_FAMILY_BILL_TYPES: ${{ inputs.bill_family_bill_types }}
          BILL_FAMILY_MAX_VERSION_FETCHES: ${{ inputs.bill_family_max_version_fetches }}
          ROLL_CALL_CHAMBERS: ${{ inputs.roll_call_chambers }}
          ROLL_CALL_MAX_VOTES: ${{ inputs.roll_call_max_votes }}
          BILL_SUBJECTS_MAX: ${{ inputs.bill_subjects_max }}
          # Gemini API key for the bill-family rollup's model-backed tables
          # (section_classifications, bill_summaries, diff_summaries —
          # spicy_docs.interpretation's classify_sections/summarize_bill/
          # summarize_diff). A keyless run skips those three rather than
          # failing; the other declared family outputs still build.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMITTEE_REPORTS_SINCE: ${{ inputs.committee_reports_since }}
          PRINT_CITATIONS_SINCE: ${{ inputs.print_citations_since }}
          SENATE_EXPENDITURES_SINCE: ${{ inputs.senate_expenditures_since }}
          FCC_SINCE: ${{ inputs.fcc_since }}
          FR_SINCE: ${{ inputs.fr_since }}
          USASPENDING_EVERY_FUNDED: ${{ inputs.usaspending_every_funded }}
          LDA_FILING_YEAR: ${{ inputs.lda_filing_year }}
          FEC_COMMITTEES_FULL_WALK: ${{ inputs.fec_committees_full_walk }}
          GAO_GOVINFO_HISTORY: ${{ inputs.gao_govinfo_history }}
          GAO_GOVINFO_MODS: ${{ inputs.gao_govinfo_mods }}
          GAO_PRODUCT_PAGES: ${{ inputs.gao_product_pages }}
          GAO_PRODUCT_PAGES_UNDO: ${{ inputs.gao_product_pages_undo }}
          GAO_ALLOW_MASS_CLOSE_REASON: ${{ inputs.gao_allow_mass_close_reason }}
          FCC_PROCEEDINGS: ${{ inputs.fcc_proceedings }}
          # The two CourtListener search rollups get the token, because live
          # search refuses without one: court_dockets (daily, a few search
          # pages; keyless runs timed out on 429s 2026-09-21/22) and the weekly
          # court_opinion_clusters search catch-up (owner decision 2026-10-30,
          # ss-3uia). Both draw on one account's quota, which CourtListener
          # applies per user (measured 2026-09-22 on a free token: 10/min,
          # 100/hour, 250/day). The daily docket job has priority: if the quota
          # runs short, defer or cancel the weekly catch-up, which stops before
          # replacing its published table and resumes above it next week. The
          # catch-up allots itself 50 requests a run (CourtListenerReader's
          # default traversal budget); there is no quota scheduler (ss-yf0a).
          # Bulk downloads and verified replay need no token; every other
          # rollup stays keyless.
          COURTLISTENER_API_TOKEN: ${{ (inputs.command == 'run-rollup-courtlistener' || inputs.command == 'run-rollup-court-opinion-clusters') && secrets.COURTLISTENER_API_TOKEN || '' }}
          # Zyte is a paid proxy; only a rollup that reads a walled host through it gets the token:
          # gao-recommendations (one request a run), gao-reports only while its product-page read is on,
          # and roll-call-votes, whose Senate files senate.gov refuses to runners (a Senate read pays only
          # after its direct attempt is refused: two session menus, 25 correction re-reads and each new
          # vote a night, ss-bruk). Zyte answered senate.gov with a ban (520, unbilled) on 2026-11-09.
          # committee-rosters reads today's Senate committee file through the paid ladder (--senate-paid-ladder, owner
          # decision 2026-11-08): Zyte, then Firecrawl, then a Zyte browser session, only after the direct read is refused.
          ZYTE_TOKEN: ${{ (inputs.command == 'run-rollup-gao-recommendations' || inputs.command == 'run-rollup-roll-call-votes' || inputs.command == 'run-rollup-committee-rosters' || (inputs.command == 'run-rollup-gao-reports' && inputs.gao_product_pages)) && secrets.ZYTE_TOKEN || '' }}
          FIRECRAWL_API_KEY: ${{ inputs.command == 'run-rollup-committee-rosters' && secrets.FIRECRAWL_API_KEY || '' }}
          # Passed via env (not interpolated into the command) to keep the run
          # step free of any templated string in an executable position.
          COMMAND: ${{ inputs.command }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          if [ "$SKIP_UPLOAD" = "true" ]; then
            UPLOAD_ARG="--skip-upload"
          else
            UPLOAD_ARG="--no-skip-upload"
          fi
          ARGS=("$UPLOAD_ARG")
          if [ "$COMMAND" = 'build-fec-observations' ]; then
            ARGS+=(--manifest "$RUNNER_TEMP/fec-retained-inputs/manifest.json")
          fi
          if [ "$COMMAND" = 'run-rollup-committee-rosters' ]; then
            ARGS+=(--senate-paid-ladder)
          fi
          # Retain shared originals and receipts even when a build fails.
          export SPICYGOV_RAW_ROOT="$GITHUB_WORKSPACE/output/raw-source-originals"
          uv run --frozen "$COMMAND" "${ARGS[@]}"

      - name: Retain FEC committee source evidence
        if: always() && inputs.command == 'run-rollup-fec-committees'
        uses: actions/upload-artifact@v4
        with:
          name: fec-committee-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/fec-captures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Report the lowest free disk seen
        if: always() && inputs.free_disk
        run: |
          df -h /
          mkdir -p output
          df -k --output=avail / | tail -1 >> "$RUNNER_TEMP/disk-watch.log"
          cp "$RUNNER_TEMP/disk-watch.log" output/disk-watch.log
          awk '/^[[:space:]]*[0-9]+[[:space:]]*$/ {if (!n++ || $1 < lowest) lowest=$1} END {if (n) printf "lowest sampled free disk during the run: %.1f GiB (%d samples)\n", lowest/1048576, n}' output/disk-watch.log

      - name: Retain invocation and transferred-input audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollup-audit-${{ inputs.command }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/invocation.json
            output/disk-watch.log
            output/fec-inputs/
            output/source-evidence/
            output/raw-source-originals/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain build-only outputs and failures
        if: failure() || (success() && inputs.skip_upload)
        uses: actions/upload-artifact@v4
        with:
          name: rollup-output-${{ inputs.command }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30
