name: Rollup — lobbying_filings
on:
  schedule:
    # 19:00 UTC — ingest Senate LDA filings daily.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      since:
        description: 'Catch-up start date (YYYY-MM-DD); blank uses the stored watermark'
        required: false
        default: ''
        type: string
      until:
        description: 'Catch-up end date (YYYY-MM-DD); each run remains capped at 30 days'
        required: false
        default: ''
        type: string
      filing_year:
        description: 'Read one whole filing year (history backfill, decision 47); blank uses the posted-date window'
        required: false
        default: ''
        type: string
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-lobbying-filings
      require_bulk: true
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      lda_since: ${{ inputs.since || '' }}
      lda_until: ${{ inputs.until || '' }}
      lda_filing_year: ${{ inputs.filing_year || '' }}
      # A filing year is read at about 875 filings a minute keyed (2026's 56,887 took 65 minutes), and
      # LDA's largest year, 2025, states 108,999 (~125 minutes). The window's watermark moves only on publish, so a
      # limit it cannot finish under would repeat every night. Without receipts (ss-vse3) a nightly is the read plus
      # about 5 minutes (9 on the first night, which fills url from the last receipts): the 2026-11-10 run spent 23 s
      # reading and about 20 of its 29 minutes on receipts (run 42882128420). A capped 30-day catch-up (25,007
      # filings) took at most 26 minutes to read, merge and write receipts (run 41232319025), so at most about 35 now.
      timeout_minutes: ${{ inputs.filing_year && 240 || 45 }}
  freshness:
    # Inspect the selected public data even when acquisition or publication failed.
    # A successful empty interval must not leave an old posting watermark unnoticed.
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Check newest public lobbying posting
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: uv run --frozen python scripts/check_rollup_freshness.py --table lobbying_filings
