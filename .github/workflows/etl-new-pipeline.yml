name: ETL (new pipeline)

# One process loads the processed-key manifest and discovers agencies once.
# It reads and publishes every agency's dockets and documents first, in one
# pass; the batches then read comments only (run_sweep says why).
# Each pass commits its retry checkpoints and manifest before the next starts.
# A failure stops the sweep and blocks final publication; a fresh runner resumes
# from the durable checkpoint. A dockets and documents pass that fails before
# recording a key is an error annotation instead: the comment batches still run,
# then the job fails, so the consumers do not publish. A scheduled sweep stops
# starting batches at its time budget and exits cleanly, so the consumers publish
# the batches it finished; the next scheduled sweep begins at the batch it
# stopped before.
# Manual single-batch dispatch remains supported.
# Callers retain comments-catalog-write through mirror/consumer finalization.
on:
  schedule:
    - cron: '25 6 * * *'   # daily sweep
    # Retry only: every sweep re-lists all of Mirrulations (29M record files on
    # 2026-09-25) however little is new, so this exits once a scheduled sweep
    # has succeeded today without stopping at its time budget.
    - cron: '25 18 * * *'
  workflow_dispatch:
    inputs:
      agency:
        description: 'Process only this agency (leave empty for all)'
        required: false
        default: ''
        type: string
      since_year:
        description: 'Only process dockets from this year onward (e.g. 2025)'
        required: false
        default: ''
        type: string
      batch_number:
        description: 'Batch number (0-indexed); or all for the dockets and documents pass, then every comment batch, with no time budget (give it timeout_minutes 360); leave empty to run one job over all agencies'
        required: false
        default: ''
        type: string
      full_refresh:
        description: 'Ignore manifest + existing output (reprocess everything). Refused without an agency or year: the whole mirror is the bundled back-fill (ss-te3x)'
        required: false
        default: false
        type: boolean
      skip_upload:
        description: 'Skip R2 upload (recommended while vetting)'
        required: false
        default: true
        type: boolean
      allow_fresh_start:
        description: 'Start from an empty manifest when none is published (re-downloads every agency''s full history). Scheduled runs never do. Refused without an agency or year (ss-te3x back-fill).'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: 'Job timeout in minutes for this dispatch (default 120, at most 360). A manual all sweep has no budget: at 120 it is killed in its first comment batch'
        required: false
        default: '120'
        type: string

env:
  # A scheduled sweep splits the discovered agencies into this many batches.
  BATCH_COUNT: 15
  # A native crash (exit 139) prints every thread's Python stack instead of nothing
  # (run 36326715409 segfaulted in the R2 publish step and left no trace).
  PYTHONFAULTHANDLER: "1"
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

concurrency:
  # Serialize every writer to the Iceberg `comments` table. The upsert is a
  # checked MERGE that refuses a prior changed under it, and any write (rows or
  # schema) during the mirror export makes that export refuse. This group also
  # keeps two ETL runs (the redundant 06:25/18:25 sweeps, or a dispatch over a
  # scheduled run) — and the dedupe/backfill workflows, which share this group —
  # from ever writing the catalog at the same time. cancel-in-progress:false so a
  # queued run waits for the in-flight one instead of cancelling it mid-write.
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gen.outputs.run }}
      batch: ${{ steps.gen.outputs.batch }}
      skip_upload: ${{ steps.gen.outputs.skip_upload }}
      timeout_minutes: ${{ steps.gen.outputs.timeout_minutes }}
      sweep_budget_minutes: ${{ steps.gen.outputs.sweep_budget_minutes }}
      sweep_start_batch: ${{ steps.gen.outputs.sweep_start_batch }}
    steps:
      - name: Resolve sweep or manual batch
        id: gen
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BATCH_NUMBER: ${{ inputs.batch_number }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          RUN=true
          if [ "$EVENT" = "schedule" ] && [ "${SCHEDULE:-}" = '25 18 * * *' ]; then
            # A sweep that stopped at its time budget succeeds, so its consumers publish, and
            # leaves a sweep-stopped artifact: batches remain, and the retry is still needed.
            SUCCEEDED=$(gh run list --workflow etl-new-pipeline.yml --event schedule --status success \
              --created ">=$(date -u +%F)" --json databaseId --jq '.[].databaseId' || true)
            for RUN_ID in $SUCCEEDED; do
              # An unanswered question, this one or the list above, counts as "stopped": the retry runs.
              STOPPED=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=sweep-stopped" --jq .total_count || true)
              if [ "$STOPPED" = "0" ]; then
                echo "Scheduled sweep $RUN_ID covered every batch today; the retry sweep is not needed."
                RUN=false
                break
              fi
            done
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          SWEEP_BUDGET=
          SWEEP_START=
          if [ "$EVENT" = "schedule" ] && [ "$RUN" = "true" ]; then
            # Begin where the latest scheduled sweep stopped at its budget and wrap to the first
            # batch. A batch that merges new comment rows took 79.4 minutes (run 42674437011), so
            # sweeps that always began at the first batch would never reach the later ones. This
            # lookup must never stop the sweep: a list or download that fails, a sweep that left
            # no sweep-stopped artifact (the download then exits 1) and an artifact without the
            # file all begin at 0.
            SWEEP_START=0
            LAST=$(gh run list --workflow etl-new-pipeline.yml --event schedule --status completed --limit 1 \
              --json databaseId --jq '.[].databaseId' || true)
            STOPPED_DIR=$(mktemp -d || true)
            if printf '%s' "$LAST" | grep -Eq '^[0-9]+$' && [ -n "$STOPPED_DIR" ] \
              && gh run download "$LAST" --name sweep-stopped --dir "$STOPPED_DIR" \
              && [ -f "$STOPPED_DIR/sweep-stopped.txt" ]; then
              STOPPED_BEFORE=$(tr -d '[:space:]' < "$STOPPED_DIR/sweep-stopped.txt" || true)
              if printf '%s' "$STOPPED_BEFORE" | grep -Eq '^[0-9]+$' && [ "$STOPPED_BEFORE" -lt "$BATCH_COUNT" ]; then
                SWEEP_START="$STOPPED_BEFORE"
              else
                echo "Sweep $LAST names no batch in 0..$((BATCH_COUNT - 1)); beginning at the first." >&2
              fi
            fi
            echo "This sweep begins at batch $SWEEP_START (0-indexed)."
          fi
          if [ "$EVENT" = "schedule" ]; then
            TIMEOUT=360
            # The sweep starts no comment batch it does not expect to finish by this minute; the
            # dockets and documents pass before them counts toward it. Its estimate for a batch
            # is at least the 80-minute floor (SWEEP_BATCH_FLOOR_SECONDS), so the last batch
            # starts by minute 270 - 80 = 190. The job is killed at 360; with 10
            # kept for its other steps, that batch may run 350 - 190 = 160 minutes, twice the
            # floor, and still finish. Run 42674437011 was killed inside its second batch and
            # published nothing.
            SWEEP_BUDGET=270
            BATCH_NUMBER=all
            SKIP_UPLOAD=false
          else
            TIMEOUT="${TIMEOUT_MINUTES:-120}"
          fi
          if ! printf '%s' "$TIMEOUT" | grep -Eq '^[1-9][0-9]*$' || [ "$TIMEOUT" -gt 360 ]; then
            echo "timeout_minutes must be an integer in 1..360" >&2; exit 1
          fi
          if [ "$BATCH_NUMBER" != "all" ] && [ -n "$BATCH_NUMBER" ]; then
            if ! printf '%s' "$BATCH_NUMBER" | grep -Eq '^[0-9]+$' || [ "$BATCH_NUMBER" -ge "$BATCH_COUNT" ]; then
              echo "batch_number must be all or an integer in 0..$((BATCH_COUNT - 1))" >&2; exit 1
            fi
          fi
          echo "batch=${BATCH_NUMBER:--1}" >> "$GITHUB_OUTPUT"
          echo "timeout_minutes=$TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "sweep_budget_minutes=$SWEEP_BUDGET" >> "$GITHUB_OUTPUT"
          echo "sweep_start_batch=$SWEEP_START" >> "$GITHUB_OUTPUT"
          echo "skip_upload=$SKIP_UPLOAD" >> "$GITHUB_OUTPUT"

  etl-new:
    needs: setup
    if: ${{ needs.setup.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # The full scheduled sweep shares one process, bounded by the hosted limit.
    timeout-minutes: ${{ fromJSON(needs.setup.outputs.timeout_minutes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run new pipeline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          # Cloudflare edge-cache purge after publish (best-effort; no-op if unset).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Every run routes comments through the catalog (decision 40); dockets and documents merge into their selected generations.
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
          # Free-text inputs via env (never interpolated into the shell body), then
          # validated below before they reach the command line.
          AGENCY: ${{ inputs.agency }}
          SINCE_YEAR: ${{ inputs.since_year }}
          BATCH: ${{ needs.setup.outputs.batch }}
          SWEEP_BUDGET_MINUTES: ${{ needs.setup.outputs.sweep_budget_minutes }}
          SWEEP_START_BATCH: ${{ needs.setup.outputs.sweep_start_batch }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          ALLOW_FRESH_START: ${{ inputs.allow_fresh_start }}
          SKIP_UPLOAD: ${{ needs.setup.outputs.skip_upload }}
          SPICY_REGS_REQUIRE_BULK: 'true'
        run: |
          set -euo pipefail
          if [ -n "$AGENCY" ] && ! printf '%s' "$AGENCY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "agency must match [A-Za-z0-9_-], got: $AGENCY" >&2; exit 1
          fi
          if [ -n "$SINCE_YEAR" ] && ! printf '%s' "$SINCE_YEAR" | grep -Eq '^[0-9]{4}$'; then
            echo "since_year must be a 4-digit year, got: $SINCE_YEAR" >&2; exit 1
          fi
          ARGS=()
          if [ -n "$AGENCY" ]; then ARGS+=(--agency "$AGENCY"); fi
          if [ -n "$SINCE_YEAR" ]; then ARGS+=(--since-year "$SINCE_YEAR"); fi
          if [ "$BATCH" = "all" ]; then
            ARGS+=(--sweep --batch-count "$BATCH_COUNT")
            if [ -n "$SWEEP_BUDGET_MINUTES" ]; then ARGS+=(--sweep-budget-minutes "$SWEEP_BUDGET_MINUTES"); fi
            if [ -n "$SWEEP_START_BATCH" ]; then ARGS+=(--sweep-start-batch "$SWEEP_START_BATCH"); fi
          elif [ "$BATCH" != "-1" ]; then
            ARGS+=(--batch-number "$BATCH" --batch-count "$BATCH_COUNT")
          fi
          ARGS+=(--use-iceberg --defer-comments-publication)
          if [ "$FULL_REFRESH" = "true" ]; then ARGS+=(--full-refresh); fi
          if [ "$ALLOW_FRESH_START" = "true" ]; then ARGS+=(--allow-fresh-start); else ARGS+=(--no-allow-fresh-start); fi
          if [ "$SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); else ARGS+=(--no-skip-upload); fi
          # Every Mirrulations object read is kept before it is parsed and sent to R2
          # source-evidence/ before anything it fed is merged or manifested. The runner copy
          # is scratch, deleted once R2 admits it; the failure artifact keeps any not yet sent.
          ARGS+=(--scratch-originals)
          echo "Running: uv run run-pipeline ${ARGS[*]}"
          # A failed dockets and documents pass exits non-zero after the comment batches, which may
          # still have stopped at the budget: report the stop either way, then exit with the status.
          status=0
          uv run run-pipeline "${ARGS[@]}" || status=$?
          # A sweep that stopped at its time budget concludes "success"; say so on the run page.
          if [ -f output/sweep-stopped.txt ]; then
            if [ "$status" -eq 0 ]; then
              PUBLISHED="Earlier batches are committed and this run's consumers publish them"
            else
              PUBLISHED="Earlier batches are committed; this run failed, so its consumers do not publish them"
            fi
            echo "::warning title=Sweep stopped at its time budget::Stopped before batch $(tr -d '[:space:]' < output/sweep-stopped.txt) (0-indexed) of $BATCH_COUNT. $PUBLISHED; the next scheduled sweep begins at that batch."
          fi
          exit "$status"

      # The sweep writes this file only when it stopped at its time budget. The
      # 18:25 retry reads the artifact's presence as "batches remain", and the
      # next scheduled sweep begins at the batch the file names. It is kept when the
      # job failed too: a failed dockets and documents pass fails the job after the
      # comment batches, and the next sweep must still resume them.
      - name: Record a sweep that stopped at its budget
        if: ${{ !cancelled() && hashFiles('output/sweep-stopped.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-stopped
          path: output/sweep-stopped.txt
          retention-days: 7
          # A re-run of the job would otherwise fail on the name its first attempt used.
          overwrite: true

      # Successful passes publish raw-read and comment-text retry checkpoints
      # before the manifest, even with zero new rows. Fresh runners restore both.
      - name: Upload artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etl-new-pipeline-output-batch-${{ needs.setup.outputs.batch }}
          path: output/
          retention-days: 7

  refresh-consumers:
    needs: [setup, etl-new]
    if: ${{ needs.setup.outputs.skip_upload == 'false' }}
    uses: ./.github/workflows/_regulations-refresh.yml
    secrets: inherit
