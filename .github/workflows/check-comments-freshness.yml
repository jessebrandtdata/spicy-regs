name: Check comments freshness

# Guards against the comments read surface drifting from what was verified. The
# publisher checks unique IDs, monolith and agency-file coverage of the index and
# retention of every prior ID before upload, then reads back each public file's
# SHA-256 into comments-publication.json with its catalog pair and generation.
# This job binds the current state to that receipt: every fixed public file keeps
# its receipted ETag and size, publication.v2.json's comments generation (what the
# website and MCP server read) is the receipt's, and the catalog is reachable from
# the receipt's source snapshot through compaction alone under the declared schema.
# Only a broken binding reads rows: raw catalog IDs and agency/docket/month counts
# must then equal the fixed and the generation index (OMB-2026-0034: ~39k June-2026
# comments in the index, zero rows in `comments`, drove this check). A receipt that
# names no generation or pair binds nothing, so runs read rows (~2 min) until a
# comments publication writes one; any comments-table commit other than compaction
# since the receipt fails as unpublished. The shared writer queue prevents a scheduled check
# from reading a catalog during replacement.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      agency:
        description: 'Also verify this agency_code catalog rows against the public index'
        required: false
        default: ''
        type: string
      verify_content:
        description: 'Verify all catalog rows against the public index even when the snapshot is bound'
        required: false
        default: false
        type: boolean

concurrency:
  group: comments-catalog-write
  cancel-in-progress: false
  queue: max

env:
  # Read by spicy_regs.sources.iceberg: this run holds comments-catalog-write,
  # so its catalog writes do not log the unlocked-write warning.
  SPICY_REGS_CATALOG_LOCK: comments-catalog-write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check comments freshness
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          AGENCY: ${{ inputs.agency }}
          VERIFY_CONTENT: ${{ inputs.verify_content }}
          R2_CATALOG_URI: ${{ secrets.R2_CATALOG_URI }}
          R2_CATALOG_WAREHOUSE: ${{ secrets.R2_CATALOG_WAREHOUSE }}
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}
          R2_CATALOG_NAMESPACE: ${{ secrets.R2_CATALOG_NAMESPACE }}
        run: |
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL to the public data URL for this repository}"
          ARGS=()
          if [ -n "$AGENCY" ]; then
            ARGS+=(--agency "$AGENCY")
          fi
          if [ "$VERIFY_CONTENT" = "true" ]; then
            ARGS+=(--verify-content)
          fi
          uv run --frozen python scripts/check_comments_freshness.py "${ARGS[@]}"
