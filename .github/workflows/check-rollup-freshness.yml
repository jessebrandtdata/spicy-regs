name: Check published table freshness

# Watches the base tables the daily ETL publishes (dockets, documents) alongside
# the external-source rollups. The base tables were added after a swallowed R2
# upload failure froze `dockets` at 2026-07-02 for ~8 weeks with the ETL still
# reporting success — comments had check-comments-freshness.yml, the rollups had
# this check, and the two largest base tables had nothing watching them at all.
#
# It also watches comment coverage: per-agency row counts from
# comments_index.parquet against the last known-good counts in the cached state
# file. check-comments-freshness only compares agencies present on both sides, so
# it stayed green through #197 while 76 agencies were missing from both. After a
# deliberate removal, dispatch once with accept_comment_coverage to rebaseline.

on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      accept_comment_coverage:
        description: 'Rebaseline comment coverage to current counts (after a deliberate removal)'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    # The checks read the index, family roots and row counts: about five minutes.
    # The full declared-join check left this job (ss-i1dy): each of its 152 joins
    # re-reads both tables in full through the throttled public endpoint, so 19
    # of 27 runs (10-07..11-10) hit the 45-minute cap, one unpublished table
    # aborts every join, and the six nights it finished (10-09..10-23) were red
    # on 21 joins never baselined. PR CI still checks changed declarations
    # (ci.yml); run scripts/check_table_joins.py by hand for the whole registry.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Restore row-count history
        uses: actions/cache/restore@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}
          restore-keys: rollup-freshness-

      - name: Check published tables
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          ACCEPT_COVERAGE: ${{ inputs.accept_comment_coverage }}
        run: |
          : "${R2_PUBLIC_URL:?Set R2_PUBLIC_URL to the public data URL for this repository}"
          ARGS=()
          if [ "$ACCEPT_COVERAGE" = "true" ]; then ARGS+=(--accept-comment-coverage); fi
          uv run --frozen python scripts/check_rollup_freshness.py "${ARGS[@]}"

      # Runs even when the freshness check failed: a dead purge credential and a
      # stale table are independent faults, and hiding one behind the other is
      # how the purge token went twelve days unnoticed in the first place.
      - name: Check Cloudflare purge credential
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: uv run --frozen python scripts/check_purge_credential.py --base-url "$R2_PUBLIC_URL"

      # A source a build refused while publishing the rest of its family (Table
      # III inside laws) has no age budget to breach: Table III lags months by
      # design. Its build journals the refusal, and this fails while the
      # family's current generation holds one.
      - name: Check journaled source refusals
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: uv run --frozen python scripts/check_source_refusals.py

      # A published policy missing from the shipped-policy ledger means the CI
      # guard (policy_migrations) was bypassed: the next policy change would
      # not be asked how that generation is read. One artifact.json per family.
      - name: Check published policies are recorded
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || format('https://data.{0}', vars.SPICYREGS_DOMAIN || 'spicy-regs.dev') }}
        run: uv run --frozen python -m spicy_regs.policy_migrations --base-url "$R2_PUBLIC_URL"

      - name: Save row-count history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rollup-freshness-state.json
          key: rollup-freshness-${{ github.run_id }}
