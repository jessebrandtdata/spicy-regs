name: Rollup — cfr_sections
on:
  schedule:
    # 20:30 UTC — ingest CFR section metadata ahead of the evening rollup window.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: false
        type: boolean
      replace_all:
        description: 'Re-place every listed package from its volume, not only changed ones'
        required: false
        default: false
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-cfr-sections
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      cfr_replace_all: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_all || false }}
      # The granule listing sets this, not receipts: 13.6 minutes in 42693875268
      # (2026-11-09), still running at 30 in 42104322158. Receipts took about 4.3
      # (prior restore 172 s, writer 84 s; gone since ss-vse3); the first night after
      # the switch re-places every package once (about 5 minutes: 105,207 granules
      # placed in 81 s in 42485018852), because the receipt route's table did not
      # carry the placement marker. Kept at 60 for the listing's spread.
      timeout_minutes: 60
