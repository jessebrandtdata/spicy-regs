name: Rollup — administration_policy
# Dispatch only until one hosted rehearsal with skip_upload has passed; the schedule to add then is in
# docs/local-family-refresh.md. A run that finds nothing new publishes nothing and ends green.
# Built here: the statements archive is read at its current commit.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip R2 upload (dry run)'
        required: false
        default: true
        type: boolean
jobs:
  run:
    uses: ./.github/workflows/_rollup.yml
    secrets: inherit
    with:
      command: run-rollup-administration-policy
      skip_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || false }}
      timeout_minutes: 20
