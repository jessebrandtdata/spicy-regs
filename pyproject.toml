[project]
name = "spicy-regs"
version = "0.1.6+reconcile.12"
description = "Regulations Data Analysis Tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "python-dotenv",
    "polars",
    "pyarrow",
    "tqdm",
    "httpx",
    "duckdb>=1.5.3", # Iceberg ALTER TABLE support for the nullable PDF diagnostics field
    "pandas",
    "cyclopts",
    "loguru",
    "mcp>=2.2,<3", # MCPServer (mcp.server.mcpserver) runs sync tools on worker threads
    "pyyaml",  # data dictionary descriptions (src/spicy_regs/data_dictionary.py)
    "pytz>=2026.4",  # DuckDB needs it to return TIMESTAMPTZ values; query_sql failed on any without it
]

[project.optional-dependencies]
operational-runner = ["psutil==7.2.2"] # Birth-checked process cleanup; already in the locked dev runtime.
comments-reader = ["pyiceberg[pyarrow]==0.12.0"]
source-readers = [
    "smart-open[s3]==8.0.1", # Conditional seekable S3 streams for remote generation staging
    "spicy-docs[acquisition,html,pdf,pdf-pypdf,bill-diff,courtlistener-local,yaml]==0.68.1",
    "pypdf==6.14.2", # Qualified PDF text and failure behavior
    "rulespec-artifacts==1.1.2",
    "deltatrack==0.1.0", # spicy-docs' bill-diff extra; git-sourced upstream, so declared here to bind the vendored wheel
]
embed = [
    "sentence-transformers",
    "torch",
]

[dependency-groups]
# Checkout pipelines use the pinned source wheels; base CLI/MCP installs do not.
source-readers = [
    "smart-open[s3]==8.0.1", # Conditional seekable S3 streams for remote generation staging
    "spicy-docs[acquisition,html,pdf,pdf-pypdf,bill-diff,courtlistener-local,yaml]==0.68.1",
    "pypdf==6.14.2", # Qualified PDF text and failure behavior
    "rulespec-artifacts==1.1.2",
    "deltatrack==0.1.0", # spicy-docs' bill-diff extra; git-sourced upstream, so declared here to bind the vendored wheel
]
dev = [
    "ipykernel",
    "matplotlib",
    "pre-commit",
    "pyrefly",
    "pytest",
    "ruff",
    "scikit-learn",
    "seaborn",
    "textblob",
    "ty",
]
docs = [
    "mkdocs-material",
]

[project.scripts]
build-cbo-archive-cards = "spicy_regs.transforms.cbo_archive_cards:main"
build-federal-register-layer1 = "spicy_regs.transforms.build_federal_register:layer1_main"
build-fec-financial-profiles = "spicy_regs.pipelines.fec_financial_profiles:main"
spicy-regs-run = "spicy_regs.operational_runner:main"
spicy-regs-scorecards = "spicy_regs.scorecards.operations.cli:main"
build-historical-regulations = "spicy_regs.transforms.historical_regulations:main"
build-table3-history = "spicy_regs.sources.table3_history:main"
build-uscode-editions = "spicy_regs.sources.uscode_editions:main"
audit-uscode-editions = "spicy_regs.sources.uscode_editions_audit:main"
run-rollup-scorecards = "spicy_regs.pipelines.rollups.scorecards:app"
run-rollup-scorecard-analysis = "spicy_regs.pipelines.rollups.scorecard_analysis:app"
materialize-rulemaking = "spicy_regs.pipelines.rulemaking_dataset:app"
run-rollup-court-opinion-clusters = "spicy_regs.pipelines.rollups.court_opinion_clusters:app"
run-rollup-court-citations = "spicy_regs.pipelines.rollups.court_citations:app"
run-rollup-court-opinions = "spicy_regs.pipelines.rollups.court_opinions:app"
run-rollup-bill-subjects = "spicy_regs.pipelines.rollups.bill_subjects:app"
run-pipeline = "spicy_regs.pipelines.regulations:app"
run-rollup-feed-summary = "spicy_regs.pipelines.rollups.feed_summary:app"
run-rollup-agency-stats = "spicy_regs.pipelines.rollups.agency_stats:app"
run-rollup-agency-monthly-volume = "spicy_regs.pipelines.rollups.agency_monthly_volume:app"
run-rollup-docket-search = "spicy_regs.pipelines.rollups.docket_search:app"
run-rollup-dockets = "spicy_regs.pipelines.rollups.regulatory_base:dockets_app"
fill-docket-gaps = "spicy_regs.pipelines.docket_gaps:app"
reconcile-dockets = "spicy_regs.pipelines.docket_reconcile:app"
run-rollup-documents = "spicy_regs.pipelines.rollups.regulatory_base:documents_app"
run-rollup-docket-attributes = "spicy_regs.pipelines.rollups.regulatory_base:docket_attributes_app"
run-rollup-document-attributes = "spicy_regs.pipelines.rollups.regulatory_base:document_attributes_app"
run-rollup-comment-attributes = "spicy_regs.pipelines.rollups.regulatory_base:comment_attributes_app"
run-attributes-sweep = "spicy_regs.pipelines.attributes_sweep:app"
run-rollup-discovery-signals = "spicy_regs.pipelines.rollups.discovery_signals:app"
run-rollup-fr-docket-links = "spicy_regs.pipelines.rollups.fr_docket_links:app"
run-rollup-cfr-sections = "spicy_regs.pipelines.rollups.cfr_sections:app"
run-rollup-unified-agenda = "spicy_regs.pipelines.rollups.unified_agenda:app"
run-rollup-federal-register = "spicy_regs.pipelines.rollups.federal_register:app"
run-rollup-fcc-proceedings = "spicy_regs.pipelines.rollups.fcc_proceedings:app"
run-rollup-fcc-filings = "spicy_regs.pipelines.rollups.fcc_filings:app"
run-rollup-sam-entities = "spicy_regs.pipelines.rollups.sam_entities:app"
run-rollup-lobbying-filings = "spicy_regs.pipelines.rollups.lobbying_filings:app"
